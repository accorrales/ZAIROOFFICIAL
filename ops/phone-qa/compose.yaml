# Not started automatically. No public database/API ports. VPN activation requires approval.
name: zairo-phone-qa
services:
  pg-ensayo:
    image: postgres:18.6
    environment:
      POSTGRES_DB: zairo_phone_qa
      POSTGRES_USER: zairo_phone_qa
      POSTGRES_PASSWORD: ${PHONE_QA_DB_PASSWORD:?Generate the private QA environment file first}
    volumes:
      - phone-data:/var/lib/postgresql
      - ${PHONE_QA_SCHEMA:?Provide the schema-only SQL}:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [isolated]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U zairo_phone_qa -d zairo_phone_qa"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    user: '${PHONE_QA_UID:-1000}:${PHONE_QA_GID:-1000}'
    build:
      context: ../..
      dockerfile: ops/phone-qa/backend.Dockerfile
    environment:
      ZAIRO_PHONE_QA: '1'
      NODE_ENV: development
      LOCATION_NOTIFICATIONS_ENABLED: 'false'
      DATABASE_URL: postgresql://zairo_phone_qa:${PHONE_QA_DB_PASSWORD}@pg-ensayo:5432/zairo_phone_qa
      JWT_SECRET: ${PHONE_QA_JWT_SECRET:?Generate an independent QA JWT secret}
      PHONE_QA_BIND: 0.0.0.0
      PORT: '3000'
    depends_on:
      pg-ensayo: {condition: service_healthy}
    networks: [isolated]
    volumes:
      - ${PHONE_QA_PRIVATE_DIR:?Provide the private output folder}:/qa-private
  web:
    user: '${PHONE_QA_UID:-1000}:${PHONE_QA_GID:-1000}'
    build:
      context: ${PHONE_QA_FRONTEND:?Provide the sibling frontend checkout}
      dockerfile: ops/phone-qa/frontend.Dockerfile
    environment:
      PHONE_QA_API: http://api:3000
      PHONE_QA_BIND: 0.0.0.0
      PHONE_QA_QR_FILE: /qa-qr/qr.html
    volumes:
      - ${PHONE_QA_PRIVATE_DIR}/qr:/qa-qr:ro
    ports:
      - '127.0.0.1:4306:8080'
    depends_on: [api]
    networks: [isolated, edge]
networks:
  edge: {}
  isolated:
    internal: true
volumes:
  phone-data:
