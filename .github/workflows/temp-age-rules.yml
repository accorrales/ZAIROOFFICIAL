name: Temporary age-rule validation

on:
  push:
    branches:
      - fix/infamous-age-access-rules

jobs:
  test-age-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test src/utils/eventAge.test.js
